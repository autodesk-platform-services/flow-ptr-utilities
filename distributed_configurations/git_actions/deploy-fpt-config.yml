name: Deploy FPT Distributed Configuration

on:

  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to deploy"
        required: true
        type: string

permissions:
  contents: read


jobs:

  deploy:

    name: Deploy configuration to FPT

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # Determine which tag should be deployed
      # --------------------------------------------------

      - name: Determine deployment tag
        id: version
        shell: bash
        run: |

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            TAG="${{ inputs.tag }}"

          else

            TAG="${GITHUB_REF_NAME}"

          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          echo "Deployment tag: ${TAG}"


      # --------------------------------------------------
      # Checkout EXACT tag
      # --------------------------------------------------

      - name: Checkout tagged configuration
        uses: actions/checkout@v4

        with:
          ref: ${{ steps.version.outputs.tag }}
          fetch-depth: 0


      # --------------------------------------------------
      # Verify Git state
      # --------------------------------------------------

      - name: Verify Git tag
        shell: bash
        run: |

          echo "Tag:"
          echo "${{ steps.version.outputs.tag }}"

          echo ""

          echo "Commit:"
          git rev-parse HEAD

          echo ""

          echo "Git status:"
          git status --short


      # --------------------------------------------------
      # Setup Python
      # --------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      # --------------------------------------------------
      # Install dependencies
      # --------------------------------------------------

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # --------------------------------------------------
      # Validate configuration
      # --------------------------------------------------

      - name: Validate configuration
        run: |

          python scripts/validate_config.py


      # --------------------------------------------------
      # Build ZIP
      # --------------------------------------------------

      - name: Build configuration ZIP
        id: package
        shell: bash
        run: |

          TAG="${{ steps.version.outputs.tag }}"

          ZIP_NAME="fpt-config-${TAG}.zip"

          zip -r "${ZIP_NAME}" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "__pycache__/*" \
            -x "*.pyc"

          echo "zip=${ZIP_NAME}" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Created:"
          echo "${ZIP_NAME}"

          echo ""
          echo "ZIP contents:"
          unzip -l "${ZIP_NAME}"


      # --------------------------------------------------
      # Test ZIP
      # --------------------------------------------------

      - name: Validate ZIP
        run: |

          unzip -t "${{ steps.package.outputs.zip }}"


      # --------------------------------------------------
      # Deploy to FPT
      # --------------------------------------------------

      - name: Deploy configuration to FPT
        env:

          FPT_BASE_URL:
            ${{ secrets.FPT_BASE_URL }}

          FPT_SCRIPT_NAME:
            ${{ secrets.FPT_SCRIPT_NAME }}

          FPT_SCRIPT_KEY:
            ${{ secrets.FPT_SCRIPT_KEY }}

          FPT_PIPELINE_CONFIG_ID:
            ${{ secrets.FPT_PIPELINE_CONFIG_ID }}

        run: |

          python scripts/deploy_fpt_config.py \
            "${{ steps.package.outputs.zip }}" \
            --version "${{ steps.version.outputs.tag }}"